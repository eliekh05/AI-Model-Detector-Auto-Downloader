name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check src/
      - name: Run tests
        run: pytest -q
      - name: Verify package imports
        run: python -c "from ai_model_detector import __version__; from ai_model_detector.scorer import rank_models, evaluate_model; print(__version__)"
